name: Release

# Pushing a tag like v0.1.0 runs every CI check, then publishes that version to npm with
# provenance, so users can verify the package was built here from that commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # For npm trusted publishing and the provenance attestation.
      id-token: write
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: The tag matches package.json's version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: pnpm build
      - run: node scripts/check-package.ts

      # npm, not pnpm: npm does trusted publishing (OIDC) itself. With an NPM_TOKEN secret set
      # instead, setup-node's .npmrc uses it.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
